    .tabs {

      background: #F1F5F9;
      padding: 3px;
      border-radius: 8px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      color: #0F172A;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: #0F172A;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .btn {
      background: #FFFFFF;
      color: #0F172A;
      border: 1px solid #CBD5E1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #F1F5F9;
    }
    .btn-primary {
      background: #0F172A;
      color: #FFFFFF;
      border-color: #0F172A;
    }
    .btn-primary:hover {
      background: #1E293B;
    }
    #viewer-container {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      position: relative;
      overflow: hidden;
      cursor: grab;
    }
    #viewer-container:active {
      cursor: grabbing;
    }
    .svg-wrapper {
      width: 100%;
      height: 100%;
      display: none;
    }
    .svg-wrapper.active {
      display: block;
    }
    .floating-tips {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #CBD5E1;
      color: #334155;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      pointer-events: none;

  <script>
    let currentPanZoom = null;
    let currentRole = 'admin';

    function initPanZoom(role) {
      if (currentPanZoom) {
        currentPanZoom.destroy();
        currentPanZoom = null;
      }
      const svgEl = document.querySelector('#wrapper-' + role + ' svg');
      svgEl.id = 'svg-' + role;
      currentPanZoom = svgPanZoom('#svg-' + role, {
        zoomEnabled: true,
        controlIconsEnabled: false,
        fit: true,
        center: true,
        minZoom: 0.2,
        maxZoom: 10,
        zoomScaleSensitivity: 0.2
      });
    }

    function switchTab(role) {
      currentRole = role;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.querySelectorAll('.svg-wrapper').forEach(w => w.classList.remove('active'));
      document.getElementById('wrapper-' + role).classList.add('active');

      // Update download links
      const filenameMap = {
        'admin': 'UseCase_Diagram_Administrator',
        'karyawan': 'UseCase_Diagram_Karyawan',
        'manager': 'UseCase_Diagram_Manager'
      };
      const fname = filenameMap[role];
      document.getElementById('btn-download-png').href = fname + '.png';
      document.getElementById('btn-download-png').download = fname + '.png';
      document.getElementById('btn-download-svg').href = fname + '.svg';
      document.getElementById('btn-download-svg').download = fname + '.svg';

      setTimeout(() => initPanZoom(role), 50);
    }

    function zoomIn() { if (currentPanZoom) currentPanZoom.zoomIn(); }
    function zoomOut() { if (currentPanZoom) currentPanZoom.zoomOut(); }
    function resetZoom() { if (currentPanZoom) currentPanZoom.reset(); }

    window.addEventListener('DOMContentLoaded', () => {
      initPanZoom('admin');
    });
  </script>
